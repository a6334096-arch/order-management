<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}訂單管理系統{% endblock %}</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><style>body{background:#f6f8fb}.navbar-brand{font-weight:700}.card{border:0;box-shadow:0 .15rem .7rem rgba(0,0,0,.06)}@media print{.no-print{display:none!important}body{background:white}.card{box-shadow:none}}</style></head><body>
{% if session.get('admin') %}<nav class="navbar navbar-expand-lg navbar-dark bg-dark no-print"><div class="container"><a class="navbar-brand" href="{{url_for('index')}}">訂單管理系統</a><div class="navbar-nav me-auto"><a class="nav-link" href="{{url_for('customers')}}">客戶</a><a class="nav-link" href="{{url_for('products')}}">商品</a><a class="nav-link" href="{{url_for('orders_list')}}">訂單</a></div><span class="navbar-text me-3">管理員：{{session.admin}}</span><a class="btn btn-outline-light btn-sm" href="{{url_for('logout')}}">登出</a></div></nav>{% endif %}
<div class="container py-4">{% with msgs=get_flashed_messages(with_categories=true) %}{% for cat,msg in msgs %}<div class="alert alert-{{cat}} no-print">{{msg}}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
