{% extends 'base.html' %}{% block content %}<div class="card p-4"><h2>{{'編輯' if row else '新增'}}商品</h2><form method="post" class="row g-3 mt-1"><div class="col-md-3"><label class="form-label">商品編號</label><input name="id" type="number" class="form-control" value="{{row.商品編號 if row else ''}}" {{'disabled' if row else 'required'}}></div><div class="col-md-5"><label class="form-label">名稱</label><input name="name" class="form-control" value="{{row.名稱 if row else ''}}" required></div><div class="col-md-2"><label class="form-label">單價</label><input name="price" type="number" min="0" step="0.01" class="form-control" value="{{row.單價 if row else ''}}" required></div><div class="col-md-2"><label class="form-label">庫存</label><input name="stock" type="number" min="0" class="form-control" value="{{row.庫存 if row else ''}}" required></div><div class="col-md-4"><label class="form-label">分類</label><input name="category" class="form-control" value="{{row.分類 if row else ''}}"></div><div class="col-12"><button class="btn btn-primary">儲存</button> <a class="btn btn-secondary" href="{{url_for('products')}}">返回</a></div></form></div>{% endblock %}
