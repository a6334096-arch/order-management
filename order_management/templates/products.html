{% extends 'base.html' %}{% block content %}<div class="d-flex justify-content-between mb-3"><h2>商品管理</h2><a class="btn btn-primary" href="{{url_for('product_form')}}">＋ 新增商品</a></div><div class="card p-3 table-responsive"><table class="table align-middle"><tr><th>編號</th><th>名稱</th><th>單價</th><th>庫存</th><th>分類</th><th></th></tr>{% for r in rows %}<tr><td>{{r.商品編號}}</td><td>{{r.名稱}}</td><td>${{'%.0f'|format(r.單價)}}</td><td>{{r.庫存}}</td><td>{{r.分類}}</td><td><a class="btn btn-sm btn-outline-primary" href="{{url_for('product_form',id=r.商品編號)}}">編輯</a> <form class="d-inline" method="post" action="{{url_for('product_delete',id=r.商品編號)}}" onsubmit="return confirm('確定刪除？')"><button class="btn btn-sm btn-outline-danger">刪除</button></form></td></tr>{% endfor %}</table></div>{% endblock %}
