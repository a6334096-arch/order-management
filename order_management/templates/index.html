{% extends 'base.html' %}{% block content %}<h2 class="mb-4">管理儀表板</h2><div class="row g-3 mb-4">{% for key,label in [('customer','客戶'),('product','商品'),('orders','訂單')] %}<div class="col-md-4"><div class="card p-4"><div class="text-secondary">{{label}}總數</div><div class="display-5 fw-bold">{{counts[key]}}</div></div></div>{% endfor %}</div><div class="card p-4"><div class="d-flex justify-content-between"><h4>最近訂單</h4><a class="btn btn-primary" href="{{url_for('order_new')}}">＋ 新增訂單</a></div><div class="table-responsive"><table class="table mt-3"><tr><th>訂單</th><th>客戶</th><th>日期</th><th>狀態</th></tr>{% for r in recent %}<tr><td><a href="{{url_for('order_detail',id=r.訂單編號)}}">#{{r.訂單編號}}</a></td><td>{{r.客戶名稱}}</td><td>{{r.訂單日期}}</td><td>{{r.狀態}}</td></tr>{% endfor %}</table></div></div>{% endblock %}
