{% extends 'base.html' %}{% block content %}<div class="card p-4"><h2>{{'編輯' if row else '新增'}}客戶</h2><form method="post" class="row g-3 mt-1"><div class="col-md-3"><label class="form-label">客戶編號</label><input name="id" type="number" class="form-control" value="{{row.客戶編號 if row else ''}}" {{'disabled' if row else 'required'}}></div><div class="col-md-5"><label class="form-label">名稱</label><input name="name" class="form-control" value="{{row.名稱 if row else ''}}" required></div><div class="col-md-4"><label class="form-label">電話</label><input name="phone" class="form-control" value="{{row.電話 if row else ''}}"></div><div class="col-12"><label class="form-label">地址</label><input name="address" class="form-control" value="{{row.地址 if row else ''}}"></div><div><button class="btn btn-primary">儲存</button> <a class="btn btn-secondary" href="{{url_for('customers')}}">返回</a></div></form></div>{% endblock %}
