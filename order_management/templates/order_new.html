{% extends 'base.html' %}{% block content %}<div class="card p-4"><h2>新增訂單</h2><form method="post"><div class="row g-3 mt-1"><div class="col-md-3"><label class="form-label">訂單編號</label><input name="order_id" type="number" class="form-control" required></div><div class="col-md-3"><label class="form-label">客戶</label><select name="customer_id" class="form-select" required>{% for c in customers %}<option value="{{c.客戶編號}}">{{c.客戶編號}}－{{c.名稱}}</option>{% endfor %}</select></div><div class="col-md-3"><label class="form-label">訂單日期</label><input name="date" type="date" class="form-control" value="{{today}}" required></div><div class="col-md-3"><label class="form-label">狀態</label><select name="status" class="form-select">{% for s in statuses %}<option>{{s}}</option>{% endfor %}</select></div><div class="col-md-4"><label class="form-label">業務人員</label><input name="sales" class="form-control" required></div></div><hr><h5>選擇商品（可複選）</h5><div class="table-responsive"><table class="table"><tr><th>選取</th><th>商品</th><th>單價</th><th>庫存</th><th style="width:160px">數量</th></tr>{% for p in products %}<tr><td><input class="form-check-input" type="checkbox" name="products" value="{{p.商品編號}}"></td><td>{{p.商品編號}}－{{p.名稱}}</td><td>${{'%.0f'|format(p.單價)}}</td><td>{{p.庫存}}</td><td><input class="form-control" type="number" name="qty_{{p.商品編號}}" min="1" value="1"></td></tr>{% endfor %}</table></div><div class="alert alert-info">送出時會把目前商品單價複製到 order_item，因此日後修改商品售價不會改變歷史訂單。</div><button class="btn btn-primary">建立訂單</button> <a class="btn btn-secondary" href="{{url_for('orders_list')}}">返回</a></form></div>{% endblock %}
