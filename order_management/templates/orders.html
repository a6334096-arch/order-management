{% extends 'base.html' %}{% block content %}<div class="d-flex justify-content-between mb-3"><h2>訂單管理</h2><a class="btn btn-primary" href="{{url_for('order_new')}}">＋ 新增訂單</a></div><div class="card p-3 table-responsive"><table class="table align-middle"><tr><th>訂單</th><th>客戶</th><th>日期</th><th>總額</th><th>業務</th><th>狀態（直接更新）</th><th></th></tr>{% for r in rows %}<tr><td><a href="{{url_for('order_detail',id=r.訂單編號)}}">#{{r.訂單編號}}</a></td><td>{{r.客戶名稱}}</td><td>{{r.訂單日期}}</td><td>${{'%.0f'|format(r.總額)}}</td><td>{{r.業務人員}}</td><td><form method="post" action="{{url_for('order_status',id=r.訂單編號)}}" class="d-flex gap-2"><select name="status" class="form-select form-select-sm">{% for s in statuses %}<option {{'selected' if s==r.狀態}}>{{s}}</option>{% endfor %}</select><button class="btn btn-sm btn-outline-success">更新</button></form></td><td><form method="post" action="{{url_for('order_delete',id=r.訂單編號)}}" onsubmit="return confirm('確定刪除訂單？')"><button class="btn btn-sm btn-outline-danger">刪除</button></form></td></tr>{% endfor %}</table></div>{% endblock %}
