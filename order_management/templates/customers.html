{% extends 'base.html' %}{% block content %}<div class="d-flex justify-content-between mb-3"><h2>客戶管理</h2><a class="btn btn-primary" href="{{url_for('customer_form')}}">＋ 新增客戶</a></div><div class="card p-3 table-responsive"><table class="table align-middle"><tr><th>編號</th><th>名稱</th><th>電話</th><th>地址</th><th></th></tr>{% for r in rows %}<tr><td>{{r.客戶編號}}</td><td>{{r.名稱}}</td><td>{{r.電話}}</td><td>{{r.地址}}</td><td class="text-nowrap"><a class="btn btn-sm btn-outline-primary" href="{{url_for('customer_form',id=r.客戶編號)}}">編輯</a> <form class="d-inline" method="post" action="{{url_for('customer_delete',id=r.客戶編號)}}" onsubmit="return confirm('確定刪除？')"><button class="btn btn-sm btn-outline-danger">刪除</button></form></td></tr>{% endfor %}</table></div>{% endblock %}
